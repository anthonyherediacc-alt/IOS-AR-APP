# Builds the native LiDAR app (ios/) on a GitHub-hosted Mac and publishes an unsigned .ipa artifact.
# Install it on an iPhone from Windows with Sideloadly (it re-signs with your Apple ID).
name: iOS app (unsigned IPA)
on:
  push:
    paths: ["ios/**", "integration/**", "tools/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "integration/**", "tools/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  baseline:
    name: Original hand-demo baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f742507b9654dc71310571efb40bb7ea40ef058a
      - run: brew install xcodegen
      - name: Compile original application
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project WoundAR.xcodeproj -target WoundAR -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      - name: Geometry, identity and serialization tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee tracking-tests.log
      - name: Evaluation harness tests
        run: node --test ../tools/evaluate.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unity receiver compile and TCP smoke tests (Unity API stubs)
        run: dotnet run --project ../tools/unity-smoke/UnitySmoke.csproj
      - name: Offline image inference tool typecheck
        run: swiftc -typecheck ../tools/infer-images.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Set build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" WoundAR/Info.plist
      - name: Build (no code signing)
        run: |
          xcodebuild -project WoundAR.xcodeproj -target WoundAR -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        id: package
        run: |
          app_plist="build/Release-iphoneos/WoundAR.app/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app_plist")
          commit=$(git rev-parse --short=7 HEAD)
          name="WoundAR-v${version}-build${build}-${commit}"
          mkdir -p Payload && cp -R build/Release-iphoneos/WoundAR.app Payload/
          zip -qr "${name}.ipa" Payload
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ios/${{ steps.package.outputs.name }}.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-test-log
          path: ios/tracking-tests.log
