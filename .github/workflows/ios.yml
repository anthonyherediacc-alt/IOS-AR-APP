# Builds the native LiDAR app (ios/) on a GitHub-hosted Mac and publishes an unsigned .ipa artifact.
# Install it on an iPhone from Windows with Sideloadly (it re-signs with your Apple ID).
name: iOS app (unsigned IPA)
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (no code signing)
        run: |
          xcodebuild -project WoundAR.xcodeproj -target WoundAR -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload && cp -R build/Release-iphoneos/WoundAR.app Payload/
          zip -qr WoundAR.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WoundAR-ipa
          path: ios/WoundAR.ipa
