<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Wound Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- playsinline + muted are required for inline autoplay in iOS Safari -->
  <video id="video" playsinline muted autoplay></video>
  <!-- WebGL view draws the tracked camera frame + wound together; overlay is debug only -->
  <canvas id="view"></canvas>
  <canvas id="overlay"></canvas>
  <div id="status">Tap Start to begin.</div>
  <button id="start">Start Camera</button>
  <div id="hud">
    <label><input type="checkbox" id="debug"> Debug</label>
    <span id="debugInfo"></span>
  </div>
  <button id="panelToggle" aria-expanded="false" aria-controls="panel">Adjust</button>
  <aside id="panel" hidden>
    <label>Sideways <small>pinky ↔ thumb</small><input type="range" id="ctlX" min="-0.8" max="0.8" step="0.01"></label>
    <label>Up / down <small>wrist ↔ fingers</small><input type="range" id="ctlY" min="-1" max="1" step="0.01"></label>
    <label>Size<input type="range" id="ctlScale" min="0.1" max="1.5" step="0.01"></label>
    <label class="button">Use my picture<input type="file" id="ctlFile" accept="image/*"></label>
    <small>Transparent PNGs look best.</small>
    <button id="ctlReset" class="button">Reset to default</button>
  </aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
